theme = "fleet_dark"

[editor.soft-wrap]
enable = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[keys.normal]
D = ["ensure_selections_forward", "extend_to_line_end", "delete_selection"]
"C-[" = "goto_previous_buffer"
"C-]" = "goto_next_buffer"
A-w = ":buffer-close"
# Nushell does not support suspend: https://github.com/helix-editor/helix/discussions/10545
C-z = "no_op"

[keys.select]
C-z = "no_op"

[keys.normal."\\"]
t = ":sh hxextra terminal"
k = ":sh hxextra kill"
g = ":sh hxextra lazygit"
j = ":sh hxextra lazyjj"
b = ":sh hxextra blame %{buffer_name}"
r = ":sh hxextra repl %{language}"
s = ":sh hxextra send '%{selection}'"

[keys.select."\\"]
t = ":sh hxextra terminal"
k = ":sh hxextra kill"
g = ":sh hxextra lazygit"
j = ":sh hxextra lazyjj"
b = ":sh hxextra blame %{buffer_name}"
r = ":sh hxextra repl %{language}"
s = ":sh hxextra send '%{selection}'"

[editor]
shell = ["nu", "-c"]
